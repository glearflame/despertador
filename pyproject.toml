[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "despertador"
version = "1.4.0"
description = "Despertador, relógio mundial e cronômetro para Linux (Python puro)"
license = { text = "MIT" }
authors = [{ name = "Glear flame" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/glearflame/despertador"
Changelog = "https://github.com/glearflame/despertador/blob/main/CHANGELOG.md"
Issues = "https://github.com/glearflame/despertador/issues"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["*.egg-info"]
# Diretórios gerados pelo empacotamento não entram no lint.
extend-exclude = ["build", "dist", "*.AppDir", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
