name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ruff + pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Instalar Tcl/Tk e Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y tk8.6 tcl8.6 xvfb

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar ferramentas de desenvolvimento
        run: python -m pip install --upgrade pip ruff pytest

      - name: Lint (ruff)
        run: ruff check .

      - name: Testes (pytest sob Xvfb)
        run: xvfb-run -a python -m pytest
